[package]
name = "rSMPP"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = { version = "1.9", features = ["renderer-winit-skia"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
rand = "0.8"
thiserror = "1.0"
regex = "1"
once_cell = "1.18"
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
rustls = { version = "0.23", features = ["std", "ring"] }
rustls-pki-types = "1"
smpp-codec = "0.2.1"

[build-dependencies]
slint-build = "1.9" # This compiles the .slint file during build

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
image = "0.24"